# One port for the browser: the noVNC page from TurboVNC's web server (5801)
# and its WebSocket from the VNC server (5901), both in the desktop container.
server {
    listen 80;

    # Typing the bare IP opens noVNC
    location = / {
        return 302 /vnc.html;
    }

    location / {
        proxy_pass http://desktop:5801;
        # noVNC docs: browsers must revalidate files, or an upgrade mixes old and new JS
        add_header Cache-Control no-cache;
    }

    # noVNC's default WebSocket path
    location /websockify {
        proxy_pass http://desktop:5901;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # An idle screen sends nothing; the 60 s default would cut the session
        proxy_read_timeout 1d;
    }
}
