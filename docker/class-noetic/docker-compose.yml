services:
  desktop:
    build:
      context: .
      args:
        VNC_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
    image: class-noetic
    hostname: class-noetic
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp # fresh on every start, so the previous X server's lock never blocks a restart
    ports:
      - "5901:5901" # TurboVNC Viewer: <vm-ip>:1
    volumes:
      - home:/home/daim
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "80:80" # browser: http://<vm-ip>/
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - desktop

volumes:
  home:
