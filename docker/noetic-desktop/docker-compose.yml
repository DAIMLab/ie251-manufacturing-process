# Add/remove desktopN services and homeN volumes.
services:
  desktop-base:
    profiles: [template] # excluded by default
    image: daimlab/noetic-desktop
    env_file: [{path: .env, required: false}] # optional password override
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp # prevent stale VNC locks
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  desktop1:
    extends:
      service: desktop-base
    profiles: !reset [] # start by default
    hostname: desktop1
    ports: ["5901:5901"] # VNC: <vm-ip>::5901
    volumes: [home1:/home/daim]

  desktop2:
    extends:
      service: desktop-base
    profiles: !reset []
    hostname: desktop2
    ports: ["5902:5901"]
    volumes: [home2:/home/daim]

  desktop3:
    extends:
      service: desktop-base
    profiles: !reset []
    hostname: desktop3
    ports: ["5903:5901"]
    volumes: [home3:/home/daim]

volumes:
  home1:
  home2:
  home3:
